name: Task Manager Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # Updated to Java 21 to match your local environment
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21' 
        distribution: 'temurin'
        cache: maven

    # Step 1: Verify the Backend compiles
    - name: Build Backend
      run: mvn -f TaskManager-Backend/pom.xml clean compile

    # Step 2: Verify the Automation project compiles
    - name: Verify Automation Project
      run: mvn -f TaskManager-Automation/pom.xml clean compile

    # Step 3: Verify the Frontend structure
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      run: |
        cd TaskManager-Frontend
        npm install
