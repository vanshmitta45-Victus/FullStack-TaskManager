name: Task Manager CI Pipeline

# Trigger: This pipeline runs every time you push code to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Copy the code from GitHub to the virtual machine
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step 2: Install Java 17 on the virtual machine
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Step 3: Build the Backend (Check if the code compiles)
    - name: Build Backend
      run: mvn -f TaskManager-Backend/pom.xml clean package -DskipTests

    # Step 4: Run the Automation Suite
    # Note: In a real production environment, we would use Docker to start 
    # the DB and App. For this portfolio, we are proving the test suite 
    # can be executed by a CI tool.
    - name: Run Selenium Tests
      run: mvn -f TaskManager-Automation/pom.xml test
